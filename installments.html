<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My installments - Jao Lab Fashion & Styles</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .pl-tabs { display: flex; gap: 8px; padding: 4px 12px 10px; }
    .pl-tab { flex: 1; background: #1a1a1a; color: #ddd; border: 1px solid #333; border-radius: 14px; padding: 12px 6px; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .pl-tab b { background: #333; border-radius: 10px; padding: 1px 8px; font-size: 12px; }
    .pl-tab.on { background: #ff6a00; border-color: #ff6a00; color: #fff; font-weight: bold; }
    .pl-tab.on b { background: #fff; color: #ff6a00; }
    .pl-search { position: relative; margin: 0 12px 12px; }
    .pl-search svg { position: absolute; left: 14px; top: 14px; width: 20px; height: 20px; fill: none; stroke: #888; stroke-width: 2; stroke-linecap: round; }
    .pl-search input { width: 100%; height: 48px; background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 14px; padding: 0 14px 0 44px; font-size: 16px; }

    .pl-card { background: #1a1a1a; border: 2px solid #2a5a3a; border-radius: 16px; margin: 0 12px 14px; padding: 12px; }
    .pl-card.bad { border-color: #8a2a2a; }
    .pl-card.wait { border-color: #8a5a1a; }
    .pl-card.mute { border-color: #333; }
    .pl-card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: #bbb; margin-bottom: 10px; }
    .pl-chip { display: inline-block; border-radius: 16px; padding: 5px 12px; font-size: 13px; font-weight: bold; border: 1px solid; white-space: nowrap; }
    .pl-chip.ok { color: #6fcf73; border-color: #2e7d32; }
    .pl-chip.wait { color: #ffb066; border-color: #b8741a; }
    .pl-chip.bad { color: #ff7a7a; border-color: #c0392b; }
    .pl-chip.mute { color: #aaa; border-color: #555; }
    .pl-body { display: flex; gap: 12px; }
    .pl-thumb { width: 84px; height: 84px; flex-shrink: 0; border-radius: 10px; background: #2a2a2a center/contain no-repeat; }
    .pl-info { flex: 1; min-width: 0; }
    .pl-name { font-size: 15px; margin-bottom: 4px; }
    .pl-amt { font-size: 14px; color: #ccc; margin-bottom: 8px; }
    .pl-amt strong { color: #ff6a00; font-size: 16px; }
    .pl-prog { display: flex; justify-content: space-between; font-size: 13px; color: #bbb; margin-bottom: 5px; }
    .pl-prog span:last-child { color: #6fcf73; }
    .pl-bar { height: 7px; background: #333; border-radius: 4px; overflow: hidden; }
    .pl-bar i { display: block; height: 100%; background: #2eaa5a; }
    .pl-sub { font-size: 13px; color: #aaa; margin-top: 8px; line-height: 1.4; }

    #pl-banner { position: fixed; left: 12px; right: 12px; bottom: 84px; z-index: 12; background: #fff4ec; color: #222; border: 1px solid #ffd2b0; border-radius: 16px; padding: 12px 14px; display: none; align-items: center; gap: 12px; }
    #pl-banner strong { color: #ff6a00; font-size: 18px; display: block; }
    #pl-banner small { color: #555; font-size: 13px; }

    .pl-empty { text-align: center; color: #aaa; padding: 50px 24px; line-height: 1.7; }
    .pl-note { color: #aaa; font-size: 13px; padding: 0 14px; line-height: 1.5; }
    #pl-flash p { margin: 4px 12px 10px; padding: 10px 12px; border-radius: 10px; font-size: 14px; background: #123a1f; color: #6fcf73; }
    #pl-flash p.err { background: #3a1414; color: #ff9a9a; }

    .pl-hero { background: #fff; border-radius: 16px; margin: 0 12px; padding: 12px; }
    .pl-herophoto { height: 220px; background: #fff center/contain no-repeat; }
    .pl-tag { color: #ff6a00; font-size: 13px; margin: 16px 14px 4px; word-break: break-all; }
    .pl-h2 { font-size: 21px; margin: 0 14px 10px; line-height: 1.3; }
    .pl-detail-chip { margin: 0 14px 14px; }
    .pl-box { background: #1a1a1a; border-radius: 16px; margin: 0 12px 12px; padding: 14px; }
    .pl-box h3 { font-size: 17px; margin-bottom: 10px; }
    .pl-stage { font-size: 16px; font-weight: bold; margin-bottom: 4px; }
    .pl-stage.ok { color: #6fcf73; }
    .pl-stage.wait { color: #ffb066; }
    .pl-stage.bad { color: #ff7a7a; }
    .pl-due { color: #ff7a7a; font-size: 14px; margin: 4px 0; }
    .pl-kv { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-top: 1px solid #2c2c2c; font-size: 15px; }
    .pl-kv:first-of-type { border-top: none; }
    .pl-kv span:first-child { color: #bbb; }
    .pl-kv span:last-child { text-align: right; color: #ff6a00; }
    .pl-kv.plain span:last-child { color: #fff; }
    .pl-sched { padding: 9px 0; border-top: 1px solid #2c2c2c; font-size: 14px; }
    .pl-sched small { display: block; margin-top: 2px; font-size: 13px; }
    .pl-ok { color: #6fcf73; } .pl-wait { color: #ffb066; } .pl-bad { color: #ff7a7a; } .pl-mute { color: #aaa; }
    .pl-btn { display: block; width: calc(100% - 24px); margin: 0 12px 10px; height: 54px; border-radius: 14px; border: 1px solid #555; background: #1a1a1a; color: #fff; font-size: 16px; text-align: center; line-height: 52px; text-decoration: none; }
    .pl-btn.main { background: #ff6a00; border-color: #ff6a00; font-weight: bold; }
    .pl-btn:disabled { opacity: 0.45; }
    .pl-step { display: flex; gap: 12px; align-items: center; padding: 8px 0; color: #888; font-size: 15px; }
    .pl-step i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #555; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 13px; }
    .pl-step.done { color: #fff; }
    .pl-step.done i { background: #2eaa5a; border-color: #2eaa5a; color: #fff; }
    h4.pl-sec { margin: 16px 14px 8px; font-size: 17px; }

    .pl-sheet { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); display: none; align-items: flex-end; z-index: 60; }
    .pl-sheet.show { display: flex; }
    .pl-sheet-box { background: #1f1f1f; width: 100%; border-radius: 20px 20px 0 0; padding: 20px 16px 26px; max-height: 90vh; overflow-y: auto; }
    .pl-sheet-box h3 { font-size: 19px; margin-bottom: 4px; }
    .pl-big { color: #ff6a00; font-size: 28px; font-weight: bold; margin: 6px 0 10px; }
    .pl-bank { background: #222; border-left: 4px solid #ff6a00; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; }
    .pl-bank p { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 15px; }
    .pl-bank span { color: #aaa; }
    .pl-sheet-box input[type=file] { width: 100%; background: #222; color: #fff; border: 1px solid #444; border-radius: 12px; padding: 12px; margin: 6px 0 12px; }
    .pl-sheet-box .pl-btn { width: 100%; margin: 0 0 10px; }
  </style>
</head>
