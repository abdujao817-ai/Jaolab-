<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin - Jao Lab</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .a-item { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid #333; }
    .a-thumb { width: 70px; height: 70px; flex-shrink: 0; border-radius: 10px; background-color: #2a2a2a; background-size: cover; background-position: center; background-repeat: no-repeat; }
    .a-info { flex: 1; min-width: 0; }
    .a-info small { display: block; color: #aaa; margin: 3px 0 8px; }
    .a-btns { display: flex; flex-wrap: wrap; gap: 6px; }
    .a-btns button, .mini { background: none; color: #fff; border: 1px solid #555; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
    #preview { display: none; width: 100%; max-height: 260px; object-fit: contain; background: #fff; border-radius: 10px; margin-bottom: 14px; }
    .check { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .check input { width: auto; }
  </style>
</head>
<body>

  <div class="topbar">
    <h1>Jao Lab Admin</h1>
    <button class="mini" id="logout-btn" style="display:none; margin-left:auto">Log out</button>
  </div>

  <section class="panel" id="login-box">
    <h2>Admin login</h2>
    <p class="hint">Only the store owner can sign in here.</p>
    <div class="field">
      <label for="admin-email">Email</label>
      <input type="email" id="admin-email" placeholder="Your admin email">
    </div>
    <div class="field">
      <label for="admin-password">Password</label>
      <input type="password" id="admin-password" placeholder="Your password">
    </div>
    <p class="error" id="login-msg"></p>
    <button class="start-plan" id="login-btn">Log in</button>
  </section>

  <div id="dashboard" style="display:none">

    <section class="panel">
      <h2 id="form-title">Add product</h2>

      <div class="field">
        <label for="p-name">Product name</label>
        <input type="text" id="p-name" placeholder="e.g. Men's Casual Shirt">
      </div>
      <div class="field">
        <label for="p-price">Price (₦)</label>
        <input type="number" id="p-price" placeholder="e.g. 8500" inputmode="numeric">
      </div>
      <div class="field">
        <label for="p-stock-qty">Stock quantity (leave empty if you don't count stock)</label>
        <input type="number" id="p-stock-qty" inputmode="numeric" min="0" placeholder="e.g. 20">
      </div>
      <div class="field">
        <label for="p-sizes">Sizes (separate with commas)</label>
        <input type="text" id="p-sizes" placeholder="e.g. S, M, L, XL or 40, 41, 42">
      </div>
      <div class="field">
        <label for="p-colors">Colors (separate with commas)</label>
        <input type="text" id="p-colors" placeholder="e.g. Black, White, Red">
      </div>
      <div class="field">
        <label for="p-extra">More photos (optional, choose several)</label>
        <input type="file" id="p-extra" accept="image/*" multiple>
      </div>
      <div id="extra-list"></div>
      <div class="field">
        <label for="p-category">Category</label>
        <select id="p-category">
          <option value="">Select a category</option>
          <option>Women</option>
          <option>Men</option>
          <option>Kids</option>
          <option>Shoes</option>
          <option>Bags</option>
          <option>Accessories</option>
        </select>
      </div>
      <div class="field">
        <label for="p-description">Description (optional)</label>
        <textarea id="p-description" rows="3" placeholder="Short description"></textarea>
      </div>
      <div class="field">
        <label for="p-photo">Photo</label>
        <input type="file" id="p-photo" accept="image/*">
      </div>
      <img id="preview" alt="Photo preview">
      <label class="check"><input type="checkbox" id="p-stock" checked> In stock</label>

      <p class="error" id="form-msg"></p>
      <button class="start-plan" id="save-btn">Add product</button>
      <button class="add-cart" id="cancel-edit" style="display:none">Cancel edit</button>
    </section>

    <section class="panel">
      <h2>Products</h2>
      <div id="admin-list"></div>
    </section>

    <section class="panel">
      <h2>Orders</h2>
      <div class="field">
        <label for="order-filter">Show</label>
        <select id="order-filter">
          <option value="">All orders</option>
          <option value="awaiting_verification">Awaiting verification</option>
          <option value="payment_verified">Payment verified</option>
          <option value="payment_rejected">Payment rejected</option>
          <option value="processing">Processing</option>
          <option value="dispatched">Dispatched</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div id="orders-admin"></div>
    </section>
  </div>

  <script src="js/data.js"></script>
  <script src="js/admin-orders.js"></script>
  <script src="js/admin-installments.js"></script>
  <script src="js/admin-gallery.js"></script>
  <script src="js/admin-delivery.js"></script>
  <script src="js/admin-reviews.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
